# Bygger statussiden på nytt fire ganger i døgnet, slik at arkivet (90 dager) og planlagt
# vedlikehold er oppdatert uten endringer i data (B17). Leverandørstatus kommer via
# jobben «Leverandørstatus», som committer ved endring (B27), og hver commit gir nytt bygg.
# Kaller Cloudflare Pages-deploy hook. URL-en er en hemmelighet i miljøet «production».
# Mangler secreten, avsluttes jobben uten feil.
#
# Cloudflare Pages Free har 500 bygg per måned. Fire bygg i døgnet gir ca. 124, og gir rom
# for bygg fra leverandørstatus (maks 30 automatiske commits per døgn, se scripts/vakt.mjs).
name: Bygg jevnlig

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bygg-jevnlig
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Start bygg i Cloudflare Pages
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::CF_DEPLOY_HOOK_URL er ikke satt i miljøet production. Hopper over."
            exit 0
          fi
          curl -fsS -X POST --max-time 30 -o /dev/null "$HOOK"
          echo "Bygg startet."
